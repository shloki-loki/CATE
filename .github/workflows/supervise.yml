name: Supervise

# Every hour: take work back from agents that went silent, wake agents whose usage-limit rest is over,
# block tasks whose inputs failed. Agents also run this on every check-in; this covers quiet hours.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cate-data
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m cate supervise --by github-actions
